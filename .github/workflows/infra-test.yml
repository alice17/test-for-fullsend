# Generated by Cursor
# Intentionally failing CI job for testing the ci-diagnose agent infra path.
# Failures use registry/quota/runner language so classification prefers `infra`.
name: Infra test

on:
  pull_request:
  workflow_dispatch:
    inputs:
      outcome:
        description: "Forced outcome for controlled testing"
        required: true
        default: fail
        type: choice
        options:
          - fail
          - pass

permissions:
  contents: read

concurrency:
  group: infra-test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  infra-pull:
    name: infra-pull
    runs-on: ubuntu-latest
    steps:
      - name: Simulate infrastructure failure
        env:
          FORCED_OUTCOME: ${{ github.event_name == 'workflow_dispatch' && inputs.outcome || 'fail' }}
        run: |
          set -euo pipefail

          echo "::notice::Infra fixture job (outcome mode: ${FORCED_OUTCOME})"

          case "${FORCED_OUTCOME}" in
            pass)
              echo "Forced pass for controlled testing."
              exit 0
              ;;
            fail)
              ;;
            *)
              echo "::error::Unknown outcome mode: ${FORCED_OUTCOME}"
              exit 1
              ;;
          esac

          # Emit signatures that classify-ci-failure treats as infra.
          cat <<'EOF'
          ERROR: failed to pull image ghcr.io/example/ci-runner:latest
          Error response from daemon: Get "https://ghcr.io/v2/": remote error: 503 Service Unavailable
          registry.npmjs.org: npm ERR! code ECONNREFUSED
          npm ERR! network request to https://registry.npmjs.org/lodash failed, reason: connect ECONNREFUSED
          GitHub Actions has been rate-limited; unable to schedule a runner
          No space left on device: /var/lib/docker
          EOF

          echo "::error::infra-pull failed: container registry 503 and runner quota/disk exhaustion (persistent infra)"
          exit 1
