# Generated by Cursor
# Intentionally flaky CI job for testing the ci-diagnose agent retry path.
# Failures use timeout/race language so classification prefers `flaky`.
name: Flaky test

on:
  pull_request:
  workflow_dispatch:
    inputs:
      outcome:
        description: "Forced outcome for controlled testing"
        required: true
        default: random
        type: choice
        options:
          - random
          - fail
          - pass

permissions:
  contents: read

concurrency:
  group: flaky-test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  flaky-unit:
    name: flaky-unit
    runs-on: ubuntu-latest
    steps:
      - name: Run flaky unit suite
        env:
          FORCED_OUTCOME: ${{ github.event_name == 'workflow_dispatch' && inputs.outcome || 'random' }}
        run: |
          set -euo pipefail

          echo "::notice::Flaky fixture job (outcome mode: ${FORCED_OUTCOME})"

          case "${FORCED_OUTCOME}" in
            pass)
              echo "Forced pass for controlled testing."
              exit 0
              ;;
            fail)
              should_fail=1
              ;;
            random)
              # ~50% flake rate
              if (( RANDOM % 2 == 0 )); then
                should_fail=1
              else
                should_fail=0
              fi
              ;;
            *)
              echo "::error::Unknown outcome mode: ${FORCED_OUTCOME}"
              exit 1
              ;;
          esac

          if [[ "${should_fail}" -eq 0 ]]; then
            echo "Suite passed on this attempt."
            exit 0
          fi

          # Emit signatures that classify-ci-failure treats as flaky.
          cat <<'EOF'
          FAIL src/widget.test.js
            ● Widget › loads remote config

              Timeout - Async callback was not invoked within the 5000 ms timeout specified by jest.setTimeout.
              context deadline exceeded while waiting for network mock

              at waitForMock (src/widget.test.js:42:11)

          Test Suites: 1 failed, 1 total
          Tests:       1 failed, 1 total
          EOF

          echo "::error::flaky-unit failed: Jest timed out waiting for a network mock (non-deterministic)"
          exit 1
