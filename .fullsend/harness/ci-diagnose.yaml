# Generated by Cursor
# harness/ci-diagnose.yaml — CI diagnostic agent for GitHub Actions checks.
#
# Flow: pre_script → sandbox (agent) → post_script
#   pre_script  : collect failing GitHub Actions checks for a PR into check-context.json
#   agent       : diagnose failures, classify flaky/infra/code, write JSON result
#   post_script : post PR comment; optionally re-run flaky checks within budget
#
# The agent has NO GitHub token and NO external API access.
# All reads happen in the pre-script; all writes happen in the post-script.
# Do not add tools/disallowedTools to the agent frontmatter — scoped Bash(...)
# patterns strip Bash in Claude Code --agent sessions (fullsend#5182).
# Inference: Google Cloud Vertex AI (credentials via host_files below).
agent: agents/ci-diagnose.md
doc: docs/agent.md
model: opus
image: ghcr.io/fullsend-ai/fullsend-sandbox:latest
policy: policies/ci-diagnose.yaml

providers:
  - vertex-ai 

role: review
slug: fullsend-ai-review
trigger: >
  event.transition.kind == "comment_added"
    && has(event.transition.comment.command)
    && event.transition.comment.command == "/fs-ci-diagnose"
    && event.entity.kind == "work_item"
    && event.state.change_proposal != null
    && !event.state.change_proposal.is_fork

host_files:
  - src: env/gcp-vertex.env
    dest: /sandbox/workspace/.env.d/gcp-vertex.env
    expand: true
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
  - src: ${GCP_OIDC_TOKEN_FILE}
    dest: /sandbox/workspace/.gcp-oidc-token
    optional: true
  - src: env/ci-diagnose.env
    dest: /sandbox/workspace/.env.d/ci-diagnose.env
    expand: true
  - src: /tmp/workspace/check-context.json
    dest: /sandbox/workspace/check-context.json
    optional: true

skills:
  - skills/classify-ci-failure

pre_script: scripts/pre-ci-diagnose.sh
post_script: scripts/post-ci-diagnose.sh

validation_loop:
  script: scripts/validate-output-schema.sh
  schema: schemas/ci-diagnose-result.schema.json
  max_iterations: 2

timeout_minutes: 15

env:
  runner:
    GH_TOKEN: "${GH_TOKEN}"
    REPO_FULL_NAME: "${REPO_FULL_NAME}"
    PR_NUMBER: "${PR_NUMBER}"
    HEAD_SHA: "${HEAD_SHA}"
    CHECK_CONTEXT_FILE: /tmp/workspace/check-context.json
    FULLSEND_OUTPUT_FILE: ci-diagnose-result.json
    MAX_FLAKE_RETRIES: "${MAX_FLAKE_RETRIES}"
    MIN_RETRY_CONFIDENCE: "${MIN_RETRY_CONFIDENCE}"
  sandbox:
    ANTHROPIC_VERTEX_PROJECT_ID: "${ANTHROPIC_VERTEX_PROJECT_ID}"
    CHECK_CONTEXT_FILE: /sandbox/workspace/check-context.json
    REPO_FULL_NAME: "${REPO_FULL_NAME}"
    PR_NUMBER: "${PR_NUMBER}"
    HEAD_SHA: "${HEAD_SHA}"
    MAX_RETRIES: "1"
    TIMEOUT_SECONDS: "900"
