# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See ADR 0033 for details.
#
# The "runtime" key selects which agent runtime runs the agents, claude
# (default when unset) or pi. For one run, the 'fullsend run --runtime'
# flag wins, then FULLSEND_RUNTIME, then this file. See docs/runtimes.md.
version: "1"
roles:
    - review
agents:
    - source: https://raw.githubusercontent.com/alice17/fullsend-ci-diagnose/23b43cfd7a87d19dbcb708ee389d1cdc914cdc94/harness/ci-diagnose.yaml#sha256=0aac36b9a5643509974f5edabeffb3b66993b048b3f603d556112ae700ec4bb9
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
    - https://raw.githubusercontent.com/alice17/fullsend-ci-diagnose/
create_issues:
    allow_targets:
        repos:
            - alice17/test-for-fullsend
            - fullsend-ai/fullsend
mint_url: https://fullsend-mint-gljhbkcloq-uc.a.run.app
inference:
    project: it-gcp-cidiagnose
    wif_provider: projects/952709608696/locations/global/workloadIdentityPools/fullsend-inference/providers/gh-alice17-test-for-fullsend
