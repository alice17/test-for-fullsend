# Generated by Cursor
version: 1

# Sandbox policy for the ci-diagnose agent.
#
# No external API access except Vertex AI for LLM inference.
# All network reads (GitHub checks, logs) happen in the pre-script.
# All network writes (PR comments, check re-runs) happen in the post-script.
# The sandbox is a pure analysis environment.

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  vertex_ai:
    name: vertex-ai
    endpoints:
      - host: "*.googleapis.com"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: "**/claude"
      - path: "**/node"
